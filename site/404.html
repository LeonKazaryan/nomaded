    <title>Page Not Found · Nomaded</title>
    <meta name="robots" content="noindex">
    <script>
        // The App Store listing of 1.0 links to "privacy.html." (a trailing dot pasted along with
        // the URL), and App Store Connect only lets it change with a new version. Any link that
        // ends in stray punctuation, spaces or slashes lands here: strip them and go to the page.
        (function () {
            var path;
            try { path = decodeURIComponent(location.pathname); } catch (e) { return; }
            var clean = path.replace(/[\s.,;:!?)\]>"'»/]+$/, "");
            if (clean && clean !== path) {
                location.replace(encodeURI(clean) + location.search + location.hash);
            }
        })();
    </script>
    <!-- Served for any missing path, so every link here is absolute. -->
    <link rel="icon" href="/nomaded/icon.png">
    <link rel="stylesheet" href="/nomaded/style.css">
